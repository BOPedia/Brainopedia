name: Deploy to DreamHost via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build
        run: npm install && npm run build

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via lftp mirror
        run: |
          lftp -u "${{ secrets.SFTP_USERNAME }},${{ secrets.SFTP_PASSWORD }}" \
            -e "set sftp:auto-confirm yes; mirror --reverse --delete --verbose ./dist/ /home/bopedia/brainopedia.org/; quit" \
            sftp://${{ secrets.SFTP_HOST }}

name: Deploy to DreamHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ensures the environment matches your local setup
          cache: 'npm'

      - name: Install dependencies and Build
        run: |
          npm ci
          npm run build
          # This creates the /dist folder with the fresh index.html

          
      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete 
          # The --delete flag removes old files so they don't pile up
          path: dist/ # <--- THIS IS THE FIX: Only send the finished files
          remote_path: /home/bopedia/brainopedia.org
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_KEY }}
